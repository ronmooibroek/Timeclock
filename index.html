<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vision Chess Clock — On-Device</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Georgia',serif;background:#0a0a0a;color:#f0e6c8;overflow-x:hidden}

@keyframes fadeUp   {from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn   {from{opacity:0}to{opacity:1}}
@keyframes tickPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dotBlink {0%,100%{opacity:1}50%{opacity:.1}}
@keyframes glowGold {0%,100%{box-shadow:0 0 8px rgba(212,175,55,.35)}50%{box-shadow:0 0 22px rgba(212,175,55,.9)}}
@keyframes glowBlue {0%,100%{box-shadow:0 0 8px rgba(126,184,212,.35)}50%{box-shadow:0 0 22px rgba(126,184,212,.9)}}
@keyframes spin     {to{transform:rotate(360deg)}}
@keyframes recPulse {0%,100%{opacity:1}50%{opacity:.3}}

.screen{display:none;min-height:100vh;animation:fadeIn .35s ease both}
.screen.active{display:flex}
.center-col{flex-direction:column;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 50% 0%,#1a1408,#0a0a0a 70%)}

input.inp{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.25);border-radius:4px;
  color:#f0e6c8;font-family:'Georgia',serif;font-size:15px;padding:11px 15px;width:100%;outline:none;
  transition:border-color .2s,box-shadow .2s}
input.inp:focus{border-color:#d4af37;box-shadow:0 0 0 3px rgba(212,175,55,.1)}
input.inp::placeholder{color:rgba(240,230,200,.2)}

button.btn{border-radius:4px;font-family:'Georgia',serif;letter-spacing:2px;cursor:pointer;
  text-transform:uppercase;transition:all .18s;border:1px solid transparent;font-size:12px}
button.btn:disabled{opacity:.3;cursor:not-allowed}
button.gold {background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.4);color:#d4af37}
button.gold:hover:not(:disabled){background:rgba(212,175,55,.22)}
button.solid{background:#d4af37;border-color:#d4af37;color:#0a0a0a;font-weight:bold}
button.solid:hover:not(:disabled){background:#e8c94a}
button.ghost{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:rgba(240,230,200,.45)}
button.ghost:hover:not(:disabled){background:rgba(255,255,255,.09);color:rgba(240,230,200,.8)}

/* ── loading ── */
#screen-load .spinner{width:38px;height:38px;border:2px solid rgba(212,175,55,.15);
  border-top-color:#d4af37;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 20px}

/* ── train screen ── */
#screen-train{padding:20px 16px}
#screen-train .wrap{animation:fadeUp .45s ease both;width:100%;max-width:520px}
#screen-train h1{color:#d4af37;font-size:20px;font-weight:normal;letter-spacing:4px;
  text-transform:uppercase;text-align:center}
.step-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(212,175,55,.18);transition:all .3s}
.step-dot.on{background:#d4af37;box-shadow:0 0 8px #d4af37}

.viewfinder{position:relative;width:320px;height:240px;background:#111;border-radius:8px;
  overflow:hidden;border:1px solid rgba(212,175,55,.3)}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
/* the square guide = exactly the region fed to the model */
.guide{position:absolute;top:0;left:40px;width:240px;height:240px;pointer-events:none;
  border:2px dashed rgba(212,175,55,.5);border-radius:4px;transition:border-color .2s}
.guide.rec{border-color:#e05555;border-style:solid;animation:recPulse .7s ease infinite}
.vf-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.3);font-size:12px;text-align:center;padding:16px}
.rec-badge{position:absolute;top:8px;right:8px;background:rgba(224,85,85,.9);border-radius:3px;
  padding:3px 9px;color:#fff;font-size:10px;letter-spacing:1px;display:none}

.sample-bar{width:320px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.sample-fill{height:100%;width:0%;background:#d4af37;transition:width .12s linear}
.sample-count{font-size:11px;letter-spacing:2px;color:rgba(240,230,200,.4)}

.thumb-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.thumb-box{text-align:center}
.thumb-box img{width:110px;height:110px;border-radius:6px;object-fit:cover;display:block;margin-bottom:6px}

/* ── clock screen ── */
#screen-clock{flex-direction:column;background-image:radial-gradient(ellipse at 50% 0%,#1a1408,#0a0a0a 70%)}
.clock-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
  border-bottom:1px solid rgba(212,175,55,.1);flex-shrink:0}
.clock-header .brand{color:rgba(212,175,55,.5);font-size:11px;letter-spacing:3px}
.clocks-row{display:flex;flex:1;min-height:0}
.player-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;position:relative;transition:background .35s}
.player-panel.p1{border-right:1px solid rgba(212,175,55,.07)}
.side-bar{position:absolute;top:0;bottom:0;width:3px;transition:all .3s}
.p1 .side-bar{left:0}
.p2 .side-bar{right:0}
.ref-thumb{width:54px;height:54px;border-radius:5px;object-fit:cover;margin-bottom:9px;transition:border-color .3s}
.player-label{font-size:10px;letter-spacing:3px;margin-bottom:3px}
.object-name{font-size:12px;font-style:italic;margin-bottom:12px;text-align:center;max-width:150px}
.clock-num{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s}
.active-pip{display:none;margin-top:13px;align-items:center;gap:6px;font-size:11px;letter-spacing:2px}
.active-pip .dot{width:6px;height:6px;border-radius:50%;display:inline-block;animation:dotBlink .8s ease infinite}
/* live confidence meter */
.conf-wrap{width:88px;height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:12px;overflow:hidden}
.conf-fill{height:100%;width:0%;border-radius:2px;transition:width .15s linear,background .2s}

.clock-controls{display:flex;justify-content:center;gap:10px;padding:12px 0;
  border-top:1px solid rgba(212,175,55,.08);border-bottom:1px solid rgba(212,175,55,.08);flex-shrink:0}

.clock-bottom{display:flex;padding:12px 18px 14px;align-items:flex-start;flex-shrink:0;gap:16px}
.cam-box label,.log-title{display:block;color:rgba(212,175,55,.3);font-size:10px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px}
.cam-feed{position:relative;width:140px;height:105px;background:#111;border-radius:6px;overflow:hidden;
  border:1px solid rgba(212,175,55,.14)}
.cam-feed video{width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;top:0;left:17.5px;width:105px;height:105px;border:1px solid rgba(212,175,55,.35);border-radius:3px}
.log-panel{flex:1;min-width:0}
.log-title{display:flex;align-items:center;gap:8px}
.fps-pill{color:rgba(212,175,55,.55);font-size:10px;letter-spacing:1px}
.log-entries{display:flex;flex-direction:column;gap:4px}
.log-entry{display:flex;align-items:center;gap:8px;font-size:11px;overflow:hidden}
.log-ts{color:rgba(212,175,55,.32);font-family:monospace;flex-shrink:0}
.log-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sensitivity slider */
.sens-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.sens-row label{color:rgba(212,175,55,.3);font-size:10px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;background:rgba(212,175,55,.2);
  border-radius:2px;outline:none;flex:1;max-width:130px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#d4af37;cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#d4af37;
  cursor:pointer;border:none}
.sens-val{color:rgba(240,230,200,.4);font-size:11px;font-family:monospace;width:30px}

#winner-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);
  align-items:center;justify-content:center;z-index:200;animation:fadeIn .4s ease}
#winner-overlay.show{display:flex}
#winner-overlay h2{color:#d4af37;font-size:30px;font-weight:normal;letter-spacing:4px;
  text-transform:uppercase;margin-bottom:6px}
#winner-overlay p{color:rgba(240,230,200,.35);font-size:13px;letter-spacing:2px}
</style>
</head>
<body>

<!-- ═══════════ SCREEN 0 : MODEL LOADING ═══════════ -->
<div id="screen-load" class="screen active center-col">
  <div style="text-align:center;animation:fadeUp .5s ease both">
    <div style="font-size:44px;margin-bottom:16px">♟</div>
    <div class="spinner"></div>
    <div style="color:#d4af37;font-size:13px;letter-spacing:3px;text-transform:uppercase">Loading Vision Model</div>
    <div id="load-sub" style="color:rgba(240,230,200,.28);font-size:11px;margin-top:8px;line-height:1.6">
      One-time download · runs entirely on this device afterwards
    </div>
  </div>
</div>

<!-- ═══════════ SCREEN 1 : TRAIN OBJECTS ═══════════ -->
<div id="screen-train" class="screen center-col">
  <div class="wrap">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:34px;margin-bottom:6px">♟</div>
      <h1 id="train-title">Teach Player 1's Object</h1>
      <div class="step-dots">
        <div class="step-dot on" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
      </div>
    </div>

    <!-- capture UI -->
    <div id="train-capture" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <p id="train-instruct" style="color:rgba(240,230,200,.4);font-size:12.5px;text-align:center;
        line-height:1.65;max-width:330px"></p>

      <div class="viewfinder" id="vf">
        <video id="train-video" autoplay playsinline muted></video>
        <div class="guide" id="guide"></div>
        <div class="rec-badge" id="rec-badge">● RECORDING</div>
        <div class="vf-msg" id="vf-msg">Initializing camera…</div>
      </div>

      <div class="sample-bar"><div class="sample-fill" id="sample-fill"></div></div>
      <div class="sample-count" id="sample-count">0 samples</div>

      <div id="name-wrap" style="width:100%;max-width:320px;display:none">
        <input id="obj-name" class="inp" placeholder="Name this object — e.g. white knight"/>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button id="record-btn"  class="btn gold"  style="padding:11px 26px;font-size:13px" disabled>● Hold to Record</button>
        <button id="clear-btn"   class="btn ghost" style="padding:11px 18px;display:none">↺ Clear</button>
        <button id="next-btn"    class="btn solid" style="padding:11px 26px;display:none" disabled>Next →</button>
      </div>
    </div>

    <!-- review -->
    <div id="train-review" style="display:none;flex-direction:column;align-items:center;gap:20px">
      <div class="thumb-row">
        <div class="thumb-box">
          <img id="thumb1" src="" style="border:1px solid rgba(212,175,55,.4)"/>
          <div id="thumb1-label" style="color:rgba(212,175,55,.6);font-size:11px"></div>
        </div>
        <div class="thumb-box">
          <img id="thumb2" src="" style="border:1px solid rgba(126,184,212,.4)"/>
          <div id="thumb2-label" style="color:rgba(126,184,212,.6);font-size:11px"></div>
        </div>
        <div class="thumb-box">
          <img id="thumb3" src="" style="border:1px solid rgba(255,255,255,.15)"/>
          <div id="thumb3-label" style="color:rgba(240,230,200,.35);font-size:11px"></div>
        </div>
      </div>

      <div style="width:100%;max-width:320px">
        <label style="display:block;color:rgba(212,175,55,.55);font-size:11px;letter-spacing:2px;
          text-transform:uppercase;margin-bottom:8px">◈ Minutes Per Player</label>
        <input id="mins-input" class="inp" type="number" min="1" max="180" value="10"/>
      </div>

      <div style="display:flex;gap:10px">
        <button id="redo-btn"  class="btn ghost" style="padding:10px 18px">↺ Retrain</button>
        <button id="begin-btn" class="btn solid" style="padding:13px 34px;font-size:14px">▶&nbsp; Begin Session</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ SCREEN 2 : CLOCK ═══════════ -->
<div id="screen-clock" class="screen">
  <div class="clock-header">
    <span class="brand">♟ VISION CLOCK · ON-DEVICE</span>
    <div style="display:flex;gap:8px">
      <button id="reset-btn"      class="btn ghost" style="padding:7px 13px">Reset</button>
      <button id="newsession-btn" class="btn ghost" style="padding:7px 13px">New Session</button>
    </div>
  </div>

  <div class="clocks-row">
    <div class="player-panel p1" id="panel1">
      <div class="side-bar" id="bar1"></div>
      <img class="ref-thumb" id="ref1" src="" style="border:1px solid rgba(212,175,55,.28)"/>
      <div class="player-label" id="plabel1" style="color:rgba(212,175,55,.85)">PLAYER 1</div>
      <div class="object-name" id="oname1" style="color:rgba(212,175,55,.42)"></div>
      <div class="clock-num" id="clock1" style="font-size:clamp(42px,8vw,78px)">10:00</div>
      <div class="active-pip" id="pip1" style="color:rgba(212,175,55,.8)">
        <span class="dot" style="background:#d4af37"></span> ACTIVE
      </div>
      <div class="conf-wrap"><div class="conf-fill" id="conf1" style="background:#d4af37"></div></div>
    </div>
    <div class="player-panel p2" id="panel2">
      <div class="side-bar" id="bar2"></div>
      <img class="ref-thumb" id="ref2" src="" style="border:1px solid rgba(126,184,212,.28)"/>
      <div class="player-label" id="plabel2" style="color:rgba(126,184,212,.85)">PLAYER 2</div>
      <div class="object-name" id="oname2" style="color:rgba(126,184,212,.42)"></div>
      <div class="clock-num" id="clock2" style="font-size:clamp(42px,8vw,78px)">10:00</div>
      <div class="active-pip" id="pip2" style="color:rgba(126,184,212,.8)">
        <span class="dot" style="background:#7eb8d4"></span> ACTIVE
      </div>
      <div class="conf-wrap"><div class="conf-fill" id="conf2" style="background:#7eb8d4"></div></div>
    </div>
  </div>

  <div class="clock-controls">
    <button id="playpause-btn" class="btn gold" style="padding:12px 46px;font-size:15px;letter-spacing:3px">▶&nbsp; Start</button>
  </div>

  <div class="clock-bottom">
    <div class="cam-box">
      <label>Live Feed</label>
      <div class="cam-feed">
        <video id="clock-video" autoplay playsinline muted></video>
        <div class="cam-guide"></div>
      </div>
    </div>
    <div class="log-panel">
      <div class="log-title">Detection <span class="fps-pill" id="fps-pill"></span></div>
      <div class="log-entries" id="log-entries">
        <span style="color:rgba(240,230,200,.18);font-size:11px">Press Start to begin detection…</span>
      </div>
      <div class="sens-row">
        <label>Sensitivity</label>
        <input type="range" id="sens" min="30" max="90" value="55"/>
        <span class="sens-val" id="sens-val">55%</span>
      </div>
    </div>
  </div>
</div>

<div id="winner-overlay">
  <div style="text-align:center">
    <div style="font-size:56px;margin-bottom:12px">♛</div>
    <h2 id="winner-title"></h2>
    <p id="winner-sub"></p>
    <div style="margin-top:26px;display:flex;gap:10px;justify-content:center">
      <button id="winner-again"   class="btn gold"  style="padding:10px 24px">Play Again</button>
      <button id="winner-newsess" class="btn ghost" style="padding:10px 24px">New Session</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   VISION CHESS CLOCK — fully on-device
   MobileNet feature extractor + KNN classifier (TensorFlow.js)
   No API keys, no per-frame costs, runs offline after first load.
══════════════════════════════════════════════════════════ */

const CROP = 224;              // model input size
const SAMPLES_TARGET = 40;     // samples needed per class
const REC_INTERVAL = 80;       // ms between samples while recording
const DETECT_INTERVAL = 120;   // ms between live predictions (~8fps)
const SWITCH_COOLDOWN = 700;   // ms min between clock switches
const STABLE_FRAMES = 2;       // consecutive agreeing frames before switching
const KNN_K = 10;

const S = {
  net: null, knn: null,
  step: 1,                     // 1=p1, 2=p2, 3=background, 4=review
  classes: { p1:null, p2:null, bg:null },  // { name, count, thumb }
  recording: false, recTimer: null, sampleCount: 0,
  trainStream: null, clockStream: null,
  t1:0, t2:0, active:0, running:false, winner:0,
  tickId:null, detectId:null,
  lastSwitch:0, pending:0, pendingCount:0,
  threshold:0.55,
  frameTimes:[],
};

const $ = id => document.getElementById(id);
const showScreen = id => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
};
const fmtTime = ms => {
  const s = Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
             : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
};
const stopStream = st => { if(st) st.getTracks().forEach(t=>t.stop()); };

/* ── crop the centre square of the video into a 224×224 canvas ── */
const workCanvas = document.createElement('canvas');
workCanvas.width = CROP; workCanvas.height = CROP;
const workCtx = workCanvas.getContext('2d');

function cropSquare(video){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return null;
  const side = Math.min(vw, vh);
  const sx = (vw - side)/2, sy = (vh - side)/2;
  workCtx.drawImage(video, sx, sy, side, side, 0, 0, CROP, CROP);
  return workCanvas;
}

/* ════════════════ BOOT ════════════════ */
(async function boot(){
  try{
    S.knn = knnClassifier.create();
    $('load-sub').textContent = 'Downloading MobileNet weights…';
    S.net = await mobilenet.load({version:2, alpha:1.0});
    // warm up
    tf.tidy(()=>{ S.net.infer(tf.zeros([CROP,CROP,3]), true); });
    startTraining();
  }catch(e){
    $('load-sub').innerHTML = '<span style="color:#e05555">Failed to load model.<br>Check your internet connection and reload.</span>';
  }
})();

/* ════════════════ TRAINING ════════════════ */
const STEP_CONFIG = {
  1:{ title:"Teach Player 1's Object", color:'#d4af37',
      instruct:'Hold <strong>Player 1\'s object</strong> inside the square. Press and hold <strong>Record</strong> while slowly rotating and tilting it so the model sees every angle.' },
  2:{ title:"Teach Player 2's Object", color:'#7eb8d4',
      instruct:'Now hold <strong>Player 2\'s object</strong> inside the square and record it the same way — rotate slowly for best results.' },
  3:{ title:"Teach the Empty Board", color:'#8a8a8a',
      instruct:'Finally, record the <strong>empty scene</strong> with neither object present. This teaches the model what "nothing" looks like and prevents false switches.' },
};

function startTraining(){
  S.step = 1;
  S.classes = { p1:null, p2:null, bg:null };
  S.knn.clearAllClasses();
  setStep(1);
  showScreen('screen-train');
  startTrainCamera();
}

function setStep(n){
  S.step = n;
  [1,2,3,4].forEach(i=>{
    $('dot'+i).className = 'step-dot' + (n>=i ? ' on' : '');
  });

  if(n<=3){
    const cfg = STEP_CONFIG[n];
    $('train-title').textContent = cfg.title;
    $('train-instruct').innerHTML = cfg.instruct;
    $('guide').style.borderColor = cfg.color+'88';
    $('vf').style.borderColor = cfg.color+'55';
    $('train-capture').style.display = 'flex';
    $('train-review').style.display = 'none';
    // name field only for objects, not background
    $('name-wrap').style.display = n<=2 ? 'block' : 'none';
    $('obj-name').value = '';
    $('obj-name').placeholder = n===1 ? 'Name this object — e.g. white knight'
                                       : 'Name this object — e.g. black bishop';
    resetSamples();
  } else {
    $('train-capture').style.display='none';
    $('train-review').style.display='flex';
    $('train-title').textContent='Ready to Play';
    stopStream(S.trainStream); S.trainStream=null;
    $('thumb1').src = S.classes.p1.thumb; $('thumb1-label').textContent = 'P1: '+S.classes.p1.name;
    $('thumb2').src = S.classes.p2.thumb; $('thumb2-label').textContent = 'P2: '+S.classes.p2.name;
    $('thumb3').src = S.classes.bg.thumb; $('thumb3-label').textContent = 'Empty scene';
  }
}

function resetSamples(){
  S.sampleCount = 0;
  $('sample-fill').style.width='0%';
  $('sample-count').textContent='0 samples';
  $('next-btn').style.display='none';
  $('next-btn').disabled=true;
  $('clear-btn').style.display='none';
  $('record-btn').style.display='inline-block';
}

async function startTrainCamera(){
  stopStream(S.trainStream);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:640}, height:{ideal:480} }
    });
    S.trainStream = stream;
    const v = $('train-video');
    v.srcObject = stream;
    v.onloadedmetadata = ()=>{
      v.play();
      $('vf-msg').style.display='none';
      $('record-btn').disabled=false;
    };
  }catch(e){
    $('vf-msg').innerHTML = '<span style="color:#e05555">Camera access denied.<br>Allow permissions and reload.</span>';
  }
}

/* record while button held (mouse + touch) */
const recBtn = $('record-btn');
['mousedown','touchstart'].forEach(ev=>recBtn.addEventListener(ev, e=>{ e.preventDefault(); startRec(); }));
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>recBtn.addEventListener(ev, e=>{ e.preventDefault(); stopRec(); }));

function startRec(){
  if(S.recording || recBtn.disabled) return;
  S.recording = true;
  $('guide').classList.add('rec');
  $('rec-badge').style.display='block';
  recBtn.textContent='● Recording…';
  S.recTimer = setInterval(addSample, REC_INTERVAL);
}

function stopRec(){
  if(!S.recording) return;
  S.recording=false;
  clearInterval(S.recTimer);
  $('guide').classList.remove('rec');
  $('rec-badge').style.display='none';
  recBtn.textContent='● Hold to Record';
  if(S.sampleCount>0){
    $('clear-btn').style.display='inline-block';
    $('next-btn').style.display='inline-block';
    validateNext();
  }
}

function addSample(){
  const v = $('train-video');
  const canvas = cropSquare(v);
  if(!canvas) return;

  const label = S.step===1?'p1' : S.step===2?'p2' : 'bg';
  tf.tidy(()=>{
    const img = tf.browser.fromPixels(canvas);
    const act = S.net.infer(img, true);
    S.knn.addExample(act, label);
  });

  S.sampleCount++;
  const pct = Math.min(100, (S.sampleCount/SAMPLES_TARGET)*100);
  $('sample-fill').style.width = pct+'%';
  $('sample-count').textContent = `${S.sampleCount} samples` +
    (S.sampleCount>=SAMPLES_TARGET ? ' ✓ plenty' : ` · aim for ${SAMPLES_TARGET}`);

  // capture a thumbnail at the midpoint
  if(S.sampleCount===1 || S.sampleCount===Math.floor(SAMPLES_TARGET/2)){
    S._pendingThumb = canvas.toDataURL('image/jpeg',0.85);
  }
  validateNext();
}

function validateNext(){
  const nameOK = S.step===3 || $('obj-name').value.trim().length>0;
  const enough = S.sampleCount >= 10;
  $('next-btn').disabled = !(nameOK && enough);
}

$('obj-name').addEventListener('input', validateNext);

$('clear-btn').addEventListener('click', ()=>{
  const label = S.step===1?'p1' : S.step===2?'p2' : 'bg';
  try{ S.knn.clearClass(label); }catch(e){}
  resetSamples();
});

$('next-btn').addEventListener('click', ()=>{
  const label = S.step===1?'p1' : S.step===2?'p2' : 'bg';
  const name  = S.step===3 ? 'Empty scene' : $('obj-name').value.trim();
  S.classes[label] = { name, count:S.sampleCount, thumb:S._pendingThumb };
  if(S.step<3){ setStep(S.step+1); }
  else { setStep(4); }
});

$('redo-btn').addEventListener('click', ()=>{
  S.knn.clearAllClasses();
  startTraining();
});

$('begin-btn').addEventListener('click', ()=>{
  startClock(parseInt($('mins-input').value)||10);
});

/* ════════════════ CLOCK ════════════════ */
async function startClock(mins){
  const ms = mins*60*1000;
  S.t1=ms; S.t2=ms; S.active=0; S.running=false; S.winner=0;
  S.pending=0; S.pendingCount=0; S.lastSwitch=0;
  clearInterval(S.tickId); clearInterval(S.detectId);

  $('ref1').src=S.classes.p1.thumb; $('ref2').src=S.classes.p2.thumb;
  $('oname1').textContent='"'+S.classes.p1.name+'"';
  $('oname2').textContent='"'+S.classes.p2.name+'"';
  $('clock1').textContent=fmtTime(ms); $('clock2').textContent=fmtTime(ms);
  $('playpause-btn').textContent='▶\u00a0 Start';
  $('log-entries').innerHTML='<span style="color:rgba(240,230,200,.18);font-size:11px">Press Start to begin detection…</span>';
  $('winner-overlay').classList.remove('show');
  updatePanels();
  showScreen('screen-clock');

  stopStream(S.clockStream);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:640}, height:{ideal:480} }
    });
    S.clockStream=stream;
    const v=$('clock-video');
    v.srcObject=stream;
    v.onloadedmetadata=()=>v.play();
  }catch(e){}
}

function updatePanels(){
  [1,2].forEach(pn=>{
    const on   = S.active===pn && S.running && !S.winner;
    const time = pn===1?S.t1:S.t2;
    const low  = time<30000;
    const col  = pn===1?'#d4af37':'#7eb8d4';
    $('panel'+pn).style.background = on?'rgba(212,175,55,.04)':'transparent';
    const bar=$('bar'+pn);
    bar.style.background = on?col:'transparent';
    bar.style.boxShadow  = on?`0 0 14px ${col}`:'none';
    bar.style.animation  = on?`glow${pn===1?'Gold':'Blue'} 2s ease infinite`:'none';
    $('ref'+pn).style.borderColor = on?col+'aa':col+'28';
    const clk=$('clock'+pn);
    clk.style.color = on?(low?'#ff6b6b':'#f0e6c8'):(low?'#883333':'rgba(240,230,200,.32)');
    clk.style.animation = on?'tickPulse 1s ease infinite':'none';
    $('pip'+pn).style.display = on?'flex':'none';
  });
}

function tick(){
  if(!S.running||S.winner) return;
  if(S.active===1){
    S.t1=Math.max(0,S.t1-100); $('clock1').textContent=fmtTime(S.t1);
    if(S.t1<=0) return endGame(1);
  }else if(S.active===2){
    S.t2=Math.max(0,S.t2-100); $('clock2').textContent=fmtTime(S.t2);
    if(S.t2<=0) return endGame(2);
  }
  updatePanels();
}

function endGame(loser){
  const w = loser===1?2:1;
  S.winner=w; S.running=false;
  clearInterval(S.tickId); clearInterval(S.detectId);
  $('winner-title').textContent=`Player ${w} Wins`;
  $('winner-sub').textContent=`${loser===1?S.classes.p1.name:S.classes.p2.name} ran out of time`;
  $('winner-overlay').classList.add('show');
}

$('playpause-btn').addEventListener('click',()=>{
  if(S.winner) return;
  if(!S.running){
    if(S.active===0) S.active=1;
    S.running=true;
    $('playpause-btn').textContent='⏸\u00a0 Pause';
    S.tickId=setInterval(tick,100);
    S.detectId=setInterval(detectLoop,DETECT_INTERVAL);
    updatePanels();
  }else{
    S.running=false;
    $('playpause-btn').textContent='▶\u00a0 Resume';
    clearInterval(S.tickId); clearInterval(S.detectId);
    $('conf1').style.width='0%'; $('conf2').style.width='0%';
    updatePanels();
  }
});

$('sens').addEventListener('input',function(){
  S.threshold = this.value/100;
  $('sens-val').textContent = this.value+'%';
});

/* ── the detection loop: pure local inference ── */
let busy=false;
async function detectLoop(){
  if(busy || !S.running || S.winner) return;
  const v=$('clock-video');
  const canvas=cropSquare(v);
  if(!canvas) return;
  busy=true;
  const t0=performance.now();

  try{
    const act = tf.tidy(()=> S.net.infer(tf.browser.fromPixels(canvas), true));
    const res = await S.knn.predictClass(act, KNN_K);
    act.dispose();

    const c1 = res.confidences.p1 || 0;
    const c2 = res.confidences.p2 || 0;
    $('conf1').style.width = (c1*100)+'%';
    $('conf2').style.width = (c2*100)+'%';
    $('conf1').style.background = c1>=S.threshold ? '#d4af37' : 'rgba(212,175,55,.3)';
    $('conf2').style.background = c2>=S.threshold ? '#7eb8d4' : 'rgba(126,184,212,.3)';

    let det = 0;
    if(res.label!=='bg'){
      const top = res.label==='p1'?c1:c2;
      if(top >= S.threshold) det = res.label==='p1'?1:2;
    }

    // stability filter
    if(det && det!==S.active){
      if(S.pending===det){ S.pendingCount++; }
      else { S.pending=det; S.pendingCount=1; }

      if(S.pendingCount>=STABLE_FRAMES && Date.now()-S.lastSwitch>SWITCH_COOLDOWN){
        S.active=det;
        S.lastSwitch=Date.now();
        S.pending=0; S.pendingCount=0;
        addLog(det, det===1?c1:c2);
        updatePanels();
      }
    } else if(det===S.active){
      S.pending=0; S.pendingCount=0;
    }

    // fps display
    const dt=performance.now()-t0;
    S.frameTimes.push(dt);
    if(S.frameTimes.length>20) S.frameTimes.shift();
    const avg=S.frameTimes.reduce((a,b)=>a+b,0)/S.frameTimes.length;
    $('fps-pill').textContent = `· ${avg.toFixed(0)}ms/frame`;
  }catch(e){ /* keep running */ }

  busy=false;
}

function addLog(det, conf){
  const ts=new Date().toLocaleTimeString('en-US',{hour12:false});
  const name = det===1?S.classes.p1.name : S.classes.p2.name;
  const col  = det===1?'#d4af37':'#7eb8d4';
  const div=document.createElement('div');
  div.className='log-entry';
  div.innerHTML=`<span class="log-ts">${ts}</span>`+
    `<span class="log-label" style="color:${col}">→ P${det} "${name}"</span>`+
    `<span style="color:rgba(255,255,255,.15);font-size:10px">${(conf*100).toFixed(0)}%</span>`;
  const c=$('log-entries');
  const ph=c.querySelector('span[style*="rgba(240,230,200,.18)"]');
  if(ph) ph.remove();
  c.insertBefore(div,c.firstChild);
  while(c.children.length>5) c.removeChild(c.lastChild);
  Array.from(c.children).forEach((el,i)=>el.style.opacity=Math.max(.2,1-i*.18));
}

/* reset / new session */
function resetClock(){
  S.running=false; S.active=0; S.winner=0; S.pending=0; S.pendingCount=0;
  clearInterval(S.tickId); clearInterval(S.detectId);
  const ms=(parseInt($('mins-input').value)||10)*60*1000;
  S.t1=ms; S.t2=ms;
  $('clock1').textContent=fmtTime(ms); $('clock2').textContent=fmtTime(ms);
  $('playpause-btn').textContent='▶\u00a0 Start';
  $('conf1').style.width='0%'; $('conf2').style.width='0%';
  $('log-entries').innerHTML='<span style="color:rgba(240,230,200,.18);font-size:11px">Press Start to begin detection…</span>';
  $('winner-overlay').classList.remove('show');
  updatePanels();
}
$('reset-btn').addEventListener('click',resetClock);
$('winner-again').addEventListener('click',resetClock);

function newSession(){
  S.running=false;
  clearInterval(S.tickId); clearInterval(S.detectId);
  stopStream(S.clockStream); S.clockStream=null;
  $('winner-overlay').classList.remove('show');
  S.knn.clearAllClasses();
  startTraining();
}
$('newsession-btn').addEventListener('click',newSession);
$('winner-newsess').addEventListener('click',newSession);
</script>
